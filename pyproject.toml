[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="ctf-copilot"
dynamic=["version"]
description="Modular beginner-friendly CTF first-pass assistant for Kali with evidence-driven analysis"
readme="README.md"
requires-python=">=3.10"
dependencies=[]

[tool.setuptools.dynamic]
version={attr="ctf_copilot.__version__"}

[project.scripts]
ctf="ctf_copilot.cli:main"

[tool.setuptools.packages.find]
where=["."]
include=["ctf_copilot*"]
