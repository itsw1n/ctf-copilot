[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="ctf-copilot"
version="1.0.0"
description="Modular beginner-friendly CTF first-pass assistant for Kali with evidence-driven analysis"
readme="README.md"
requires-python=">=3.10"
dependencies=[]

[project.scripts]
ctf="ctf_copilot.cli:main"

[tool.setuptools.packages.find]
where=["."]
include=["ctf_copilot*"]
